<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 360px;
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .logo-circle {
            width: 34px; height: 34px;
            background: #007bff;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }
        .logo-row strong {
            font-size: 15px;
            color: #333;
        }
        h2 {
            margin: 0 0 6px;
            color: #333;
            text-align: center;
            font-size: 19px;
        }

        /* WARNING SIGN: generic greeting rather than the student's actual name */
        .greeting {
            text-align: center;
            font-size: 13px;
            color: #777;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .textbox {
            margin-bottom: 18px;
        }
        .textbox label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        .textbox input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }

        .links-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 14px;
        }
        .links-row a {
            color: #007bff;
            text-decoration: none;
        }
        .links-row a:hover {
            text-decoration: underline;
        }

        /* WARNING SIGN: subtle grammar/spelling slips in body copy */
        .fine-print {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo-row">
        <div class="logo-circle">P</div>
        <strong>Portal</strong>
    </div>
    <h2>Confirm Your Details</h2>

    <!-- WARNING SIGN: generic "Dear Student" greeting, vague reference to "the form", no real name -->
    <div class="greeting">
        Dear Student, please login below using your schools email address and password
    </div>

    <!-- Notice action="#" means it goes nowhere. onsubmit intercepts it safely -->
    <form action="#" onsubmit="showAlert(event)">
        <div class="textbox">
            <label for="username">Username or Email</label>
            <input type="text" id="username" placeholder="enter your email" required>
        </div>
        <div class="textbox">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="enter your password" required>
        </div>

        <button type="submit" class="btn">Log In</button>
        <div class="links-row">
            <a href="#" onclick="return false;">Forgotten Login Details?</a>
            <a href="#" onclick="return false;">Need Help?</a>
        </div>
    </form>

    <!-- WARNING SIGN: subtle spelling/grammar errors a careless copy-paste leaves behind -->
    <div class="fine-print">
        By continue to use this portal you confirm your informations is correct. If you do not login before the deadline your teacher will be notifyed.
    </div>
</div>

<script>
    function showAlert(event) {
        event.preventDefault(); // Stops the page from refreshing
        const email = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Local-only pop-up to show students how a backend would steal the data.
        // Nothing here is ever sent anywhere.
        alert(`!!!!YOU'VE BEEN HACKED!!!! \n\nIf this was a real phishing site an attacker would have just gained access to your username and password!!!!\n\nEmail: ${email}\n\nPassword: ${pass}`);
    }
</script>

</body>
</html>
