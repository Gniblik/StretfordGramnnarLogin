<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
        }
        .textbox {
            margin-bottom: 20px;
        }
        .textbox label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        .textbox input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Account Sign In</h2>
    <!-- Notice action="#" means it goes nowhere. onsubmit intercepts it safely -->
    <form action="#" onsubmit="showAlert(event)">
        <div class="textbox">
            <label for="username">Username or Email</label>
            <input type="text" id="username" placeholder="enter your email" required>
        </div>
        <div class="textbox">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="enter your password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
    </form>
</div>

<script>
    function showAlert(event) {
        event.preventDefault(); // Stops the page from refreshing
        const email = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        
        // Safety visual pop-up to show students how a backend would steal the data
        alert(`🚨 SIMULATION CAPTURE! \n\nIf this were a real phishing site, the attacker would have just received:\n📧 Email: ${email}\n🔑 Password: ${pass}\n\nAlways check the URL bar before logging in!`);
    }
</script>

</body>
</html>
